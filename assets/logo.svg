<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- DeepSeek brand gradient matching ref image tone -->
    <linearGradient id="dolphinBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A5568"/>
      <stop offset="100%" stop-color="#2D3748"/>
    </linearGradient>
    <!-- Notebook paper -->
    <linearGradient id="paper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEFCFB"/>
      <stop offset="100%" stop-color="#F7F5F3"/>
    </linearGradient>
    <!-- Glow for new hash -->
    <filter id="addGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Clean light background like ref image -->
  <rect width="256" height="256" rx="20" fill="#F7FAFC"/>

  <!-- ===== NOTEBOOK ===== -->
  <g transform="translate(52, 138)">
    <!-- Notebook cover -->
    <rect width="136" height="88" rx="6" fill="url(#paper)" stroke="#CBD5E0" stroke-width="1.5"/>
    <!-- Spiral binding -->
    <g fill="#718096">
      <circle cx="-5" cy="16" r="3"/>
      <circle cx="-5" cy="34" r="3"/>
      <circle cx="-5" cy="52" r="3"/>
      <circle cx="-5" cy="70" r="3"/>
    </g>
    <!-- Lines -->
    <line x1="14" y1="22" x2="120" y2="22" stroke="#E2E8F0" stroke-width="1.2"/>
    <line x1="14" y1="38" x2="112" y2="38" stroke="#E2E8F0" stroke-width="1.2"/>
    <line x1="14" y1="54" x2="124" y2="54" stroke="#E2E8F0" stroke-width="1.2"/>
    <line x1="14" y1="70" x2="100" y2="70" stroke="#E2E8F0" stroke-width="1.2"/>

    <!-- Read context on notebook -->
    <text x="18" y="21" font-family="monospace" font-size="7.5" fill="#4A5568">ve7</text>
    <text x="44" y="21" font-family="monospace" font-size="7.5" fill="#4A5568">szJ</text>
    <text x="70" y="21" font-family="monospace" font-size="7.5" fill="#4A5568">kQm</text>

    <!-- Edit action area: show -szJ +a3m diff -->
    <g transform="translate(18, 48)">
      <!-- Removed hash: -szJ with strikethrough -->
      <text x="0" y="0" font-family="monospace" font-size="9" fill="#E53E3E" text-decoration="line-through" opacity="0.75">szJ</text>
      <!-- Arrow indicator -->
      <text x="30" y="0" font-family="monospace" font-size="9" fill="#A0AEC0">→</text>
      <!-- Added hash: +a3m highlighted -->
      <rect x="42" y="-10" width="28" height="13" rx="2" fill="#C6F6D5" opacity="0.5"/>
      <text x="45" y="0" font-family="monospace" font-size="9" fill="#22543D" font-weight="bold" filter="url(#addGlow)">a3m</text>
    </g>

    <!-- Remaining unchanged hashes below -->
    <text x="18" y="67" font-family="monospace" font-size="7.5" fill="#718096" opacity="0.6">ve7</text>
    <text x="44" y="67" font-family="monospace" font-size="7.5" fill="#718096" opacity="0.6">kQm</text>

    <!-- Cursor after edit -->
    <line x1="76" y1="52" x2="76" y2="62" stroke="#4299E1" stroke-width="1.5" stroke-linecap="round">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- ===== DOLPHIN — minimalist style matching reference image ===== -->
  <g transform="translate(64, 36)">
    <!-- Body: smooth curved shape like the ref image -->
    <path d="M24,12
             C50,-2 90,6 104,28
             C118,52 98,82 68,88
             C40,92 16,78 8,56
             C0,34 10,18 24,12Z"
          fill="url(#dolphinBody)"/>

    <!-- White belly patch (like ref image) -->
    <path d="M20,52
             C32,80 60,86 80,68
             C72,78 48,84 28,72
             C18,62 14,54 20,52Z"
          fill="#F7FAFC"/>

    <!-- Tail fin (small, curved up like ref) -->
    <path d="M8,58
             C-4,50 -6,60 2,66
             C-2,74 4,80 12,72
             Z"
          fill="url(#dolphinBody)"/>

    <!-- Dorsal fin (small, subtle) -->
    <path d="M68,18
             C78,4 88,6 90,12
             C84,18 76,24 70,24Z"
          fill="#2D3748"/>

    <!-- Left pectoral fin -->
    <path d="M26,62
             C14,72 16,82 26,78
             C30,70 28,64 26,62Z"
          fill="#2D3748" opacity="0.7"/>

    <!-- Right pectoral fin (holding pen) -->
    <path d="M78,60
             C92,68 86,80 76,76
             C72,68 74,60 78,60Z"
          fill="#2D3748" opacity="0.7"/>

    <!-- Eye — looking down at notebook (read) -->
    <ellipse cx="88" cy="40" rx="5" ry="6" fill="#FFFFFF"/>
    <circle cx="89.5" cy="41" r="3" fill="#1A202C"/>
    <circle cx="91" cy="39.5" r="1" fill="#FFFFFF"/>

    <!-- Subtle smile -->
    <path d="M94,48 Q100,52 106,48" stroke="#2D3748" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- ===== PEN held by right flipper ===== -->
  <g transform="translate(148, 108) rotate(35)">
    <rect x="0" y="0" width="4" height="30" rx="2" fill="#4299E1"/>
    <polygon points="2,30 -1,36 5,36" fill="#1A202C"/>
    <rect x="4" y="4" width="1.5" height="15" rx="0.75" fill="#2B6CB0"/>
    <!-- Ink trail on notebook showing edit -->
    <path d="M2,36 Q4,42 2,48 Q4,52 3,56" stroke="#4299E1" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- ===== FLOATING HASHES — read set + diff visualization ===== -->
  <g font-family="monospace">

    <!-- Read hashes floating (original state) -->
    <g font-size="11" font-weight="600" opacity="0.85">
      <text x="186" y="46" fill="#4A5568">ve7</text>
      <text x="206" y="66" fill="#4A5568">szJ</text>
      <text x="188" y="86" fill="#4A5568">kQm</text>
    </g>

    <!-- DIFF ANIMATION AREA: show -szJ → +a3m transition -->
    <g transform="translate(176, 108)">
      <!-- Minus: removed hash szJ fading out -->
      <text x="0" y="0" font-family="monospace" font-size="12" font-weight="bold" fill="#E53E3E" opacity="0.6">
        −szJ
        <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0,0; -8,0; 0,0" dur="2s" repeatCount="indefinite"/>
      </text>

      <!-- Plus: new hash a3m glowing in -->
      <text x="38" y="0" font-family="monospace" font-size="12" font-weight="bold" fill="#38A169" filter="url(#addGlow)">
        +a3m
        <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- Connecting dots between original hashes -->
    <g fill="#CBD5E0" opacity="0.3">
      <circle cx="198" cy="50" r="1.2"/>
      <circle cx="216" cy="72" r="1.2"/>
      <circle cx="200" cy="92" r="1.2"/>
    </g>

    <!-- Small arrow indicating transformation -->
    <g transform="translate(196, 96)" fill="#A0AEC0" opacity="0.4">
      <path d="M0,0 L6,4 L0,8 Z"/>
    </g>
  </g>

  <!-- ===== LABELS ===== -->
  <!-- "read" label near dolphin's gaze -->
  <g transform="translate(160, 56)">
    <rect x="0" y="0" width="28" height="14" rx="3" fill="#EDF2F7" opacity="0.8"/>
    <text x="14" y="10" font-family="monospace" font-size="7" fill="#4A5568" text-anchor="middle" font-weight="600">read</text>
  </g>

  <!-- "edit" label near pen -->
  <g transform="translate(178, 128)">
    <rect x="0" y="0" width="28" height="14" rx="3" fill="#EBF8FF" opacity="0.8"/>
    <text x="14" y="10" font-family="monospace" font-size="7" fill="#2B6CB0" text-anchor="middle" font-weight="600">edit</text>
  </g>

  <!-- Corner decoration dots (subtle) -->
  <circle cx="228" cy="28" r="2" fill="#E2E8F0"/>
  <circle cx="236" cy="36" r="1.5" fill="#E2E8F0"/>
  <circle cx="20" cy="228" r="2" fill="#E2E8F0"/>
  <circle cx="28" cy="236" r="1.5" fill="#E2E8F0"/>
</svg>