name: Release

# Turns a pushed version tag (v0.1.x, created by `npm publish`'s postpublish
# hook via scripts/tag-current.mjs — or pushed manually) into a GitHub
# Release with auto-generated notes.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — skipping"
          else
            gh release create "$TAG" --repo "$REPO" --generate-notes --title "$TAG"
          fi
