# pnpm 12 blocks dependency build scripts by default. esbuild (a vite dep) needs
# its postinstall to install the matching native binary; allow exactly this one.
allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - "@deepseek-ai/dsh-agent@0.2.1-rc.2"
  - "@deepseek-ai/dsh-brand@0.2.1-rc.2"
  - "@deepseek-ai/dsh-fs@0.2.1-rc.2"
  - "@deepseek-ai/dsh-home-paths@0.2.1-rc.2"
  - "@deepseek-ai/dsh-invariants@0.2.1-rc.2"
  - "@deepseek-ai/dsh-llm@0.2.1-rc.2"
  - "@deepseek-ai/dsh-ptc-runtime@0.2.1-rc.2"
  - "@deepseek-ai/dsh-sandbox-policy@0.2.1-rc.2"
  - "@deepseek-ai/dsh-sandbox@0.2.1-rc.2"
  - "@deepseek-ai/dsh-scope@0.2.1-rc.2"
  - "@deepseek-ai/dsh-session-projection@0.2.1-rc.2"
  - "@deepseek-ai/dsh-session@0.2.1-rc.2"
  - "@deepseek-ai/dsh-system-prompt@0.2.1-rc.2"
  - "@deepseek-ai/dsh-timeout@0.2.1-rc.2"
  - "@deepseek-ai/dsh-tools@0.2.1-rc.2"
  - "@deepseek-ai/dsh-typert-protocol@0.2.1-rc.2"
  - "@deepseek-ai/dsh-user-approval@0.2.1-rc.2"
  - "@deepseek-ai/dsh-util-crypto@0.2.1-rc.2"
  - "@deepseek-ai/dsh-util-values@0.2.1-rc.2"

overrides:
  # GHSA-mrhx-c7xc-m3w5: zod <4.6.6 (pinned 4.4.3 via @deepseek-ai/dsh-llm@0.2.1-rc.2)
  # has a patched release; force the fixed line until upstream re-pins.
  # Removal condition: drop once dsh pins zod >=4.6.6.
  "zod@<4.6.6": "4.6.7"

auditConfig:
  # GHSA-vfj7-8cjw-p6xm: braces <=3.0.3 (via semantic-release > micromatch) has
  # no patched release at the time of writing, and every scaffolded repo
  # inherits it, so the audit gate would be red on day one. This suppresses
  # exactly that advisory; every other high-severity advisory still fails
  # `pnpm run audit`.
  # Removal condition: drop this entry once a patched braces ships or the
  # advisory clears.
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
