project: dsh-better-edit
provider: github
remote_url: git@github.com:Rianico/dsh-better-edit.git
steering_file: AGENTS.md
domain_layout:
  glossary: GLOSSARY.md
  glossary_map: GLOSSARY-MAP.md
  adr_dir: docs/adr
  stale_files: {}
runtime:
  tmp: .lsz/tmp
toolchain:
  adr:
    detected: true
    fallback: manual directory + template
  fd:
    detected: true
    fallback: find
  rg:
    detected: true
    fallback: grep
  eza:
    detected: true
    fallback: ls / tree
  wt:
    detected: true
    fallback: git worktree
  uv:
    detected: true
    fallback: pip / python -m venv
  oxlint:
    detected: true
    fallback: ruff / eslint
  oxfmt:
    detected: true
    fallback: prettier
  basedpyright:
    detected: true
    fallback: pyright / mypy
